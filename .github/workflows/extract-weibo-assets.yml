name: Extract Weibo ZIP assets
on:
  push:
    branches: [main]
    paths:
      - "public/wb.zip"
      - "public/mzc.zip"
      - ".github/workflows/extract-weibo-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: python -m pip install --quiet pillow
      - name: Extract archive and build image inventory
        run: |
          set -euo pipefail
          test -s public/wb.zip
          mkdir -p extracted/weibo-assets extracted/mzc-assets
          unzip -q public/wb.zip -d extracted/weibo-assets
          test -s public/mzc.zip
          unzip -q public/mzc.zip -d extracted/mzc-assets
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          for label in ("weibo", "mzc"):
              root = Path(f"extracted/{label}-assets")
              files = sorted(p for p in root.rglob("*") if p.is_file())
              lines = []
              thumbs = []
              for p in files:
                  try:
                      with Image.open(p) as im:
                          im.verify()
                      with Image.open(p) as im:
                          im = ImageOps.exif_transpose(im).convert("RGB")
                          lines.append(f"{p.relative_to(root)}\\t{im.width}x{im.height}\\t{p.stat().st_size} bytes")
                          im.thumbnail((240, 180))
                          tile = Image.new("RGB", (260, 220), "white")
                          tile.paste(im, ((260-im.width)//2, 8))
                          ImageDraw.Draw(tile).text((8, 192), p.name[:36], fill="black")
                          thumbs.append(tile)
                  except Exception:
                      lines.append(f"{p.relative_to(root)}\\t(non-image)\\t{p.stat().st_size} bytes")
              (Path(f"extracted/{label}-manifest.txt")).write_text("\\n".join(lines), encoding="utf-8")
              if thumbs:
                  cols = 4
                  rows = (len(thumbs) + cols - 1) // cols
                  sheet = Image.new("RGB", (cols*260, rows*220), "#dddddd")
                  for i, tile in enumerate(thumbs):
                      sheet.paste(tile, ((i%cols)*260, (i//cols)*220))
                  sheet.save(f"extracted/{label}-contact-sheet.jpg", quality=90)
              print(f"{label}:\\n" + "\\n".join(lines))
          print("\n".join(lines))
          PY
      - name: Publish extracted WeChat avatars
        run: |
          set -euo pipefail
          mkdir -p public/wechat-assets
          cp "extracted/mzc-assets/新建文件夹/b31fbdc8057fc6c3d418e640b8d7bd76.jpg" public/wechat-assets/muzhicheng-avatar.jpg
          cp "extracted/mzc-assets/新建文件夹/ebc52d0aee1582c80cb1be77ac88a541.jpg" public/wechat-assets/zhuzhixin-avatar.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wechat-assets/
          if git diff --cached --quiet; then
            echo "Avatar assets unchanged"
          else
            git commit -m "Add WeChat conversation avatars"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: weibo-assets-extracted
          path: extracted/
          if-no-files-found: error
          retention-days: 7
